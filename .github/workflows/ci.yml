name: ci

on:
  pull_request:
  push:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  # This site is built with Bun, so it calls bun-ci. The scaffold asked for a
  # node-ci reusable that does not exist in Glyndor/.github — which is half of
  # why no run ever started here.
  bun:
    uses: Glyndor/.github/.github/workflows/bun-ci.yml@3a46ffe91ecadcce7f14c99ea8b23ead4274f325 # v1.13.2

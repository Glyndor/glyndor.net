version: 2

updates:
  # The site itself (package.json + bun.lock): Astro, Biome, the UI deps.
  - package-ecosystem: "bun"
    directory: "/"
    schedule:
      interval: "daily"
    labels:
      - "type:deps"
    open-pull-requests-limit: 10
    target-branch: "develop"

  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "daily"
    labels:
      - "type:deps"
      - "type:ci"
    open-pull-requests-limit: 10
    target-branch: "develop"

name: ci

on:
  pull_request:
  push:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  # This site is built with Bun, so it calls bun-ci. The scaffold asked for a
  # node-ci reusable that does not exist in Glyndor/.github — which is half of
  # why no run ever started here.
  bun:
    uses: Glyndor/.github/.github/workflows/bun-ci.yml@8ae47ccd49ffdbf59d1acf7e6f9c18165bfba959 # v1.19.0
  pin-policy:
    uses: Glyndor/.github/.github/workflows/pin-policy-reusable.yml@d4bbc5b6ec0c351ca4cb17d948ceaad818da4078 # v1.18.1
  dependabot-freshness:
    uses: Glyndor/.github/.github/workflows/dependabot-freshness.yml@d4bbc5b6ec0c351ca4cb17d948ceaad818da4078 # v1.18.1
    with:
      max-age-days: 15

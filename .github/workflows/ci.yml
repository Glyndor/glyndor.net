name: ci

on:
  pull_request:
  push:
    branches: [develop, main]

permissions:
  contents: read

jobs:
  # This site is built with Bun, so it calls bun-ci. The scaffold asked for a
  # node-ci reusable that does not exist in Glyndor/.github — which is half of
  # why no run ever started here.
  bun:
    uses: Glyndor/.github/.github/workflows/bun-ci.yml@d4bbc5b6ec0c351ca4cb17d948ceaad818da4078 # v1.18.1
  pin-policy:
    uses: Glyndor/.github/.github/workflows/pin-policy-reusable.yml@d4bbc5b6ec0c351ca4cb17d948ceaad818da4078 # v1.18.1
  dependabot-freshness:
    uses: Glyndor/.github/.github/workflows/dependabot-freshness.yml@d5041b038b7d4935e75400dff612962e6fa14893 # v1.21.0
    with:
      max-age-days: 15
